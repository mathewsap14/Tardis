<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a4a8c"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Tardis</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#e8f1fc;--card:#ffffff;--card2:#f0f6fd;--line:#c9d9ec;--fg:#0b2a52;--mut:#587091;--acc:#0a4a8c;--gold:#f2b705;--r:16px}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#f3f8ff,#d9e8f8) fixed;color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
.shell{min-height:100dvh;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:12px;max-width:1500px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.3px;font-size:18px}
.brand svg{width:26px;height:26px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px;color:var(--mut)}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px}
.chip.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
header{background:var(--acc);border-radius:14px;padding:8px 14px;color:#fff;box-shadow:0 2px 10px #0a4a8c33}
header .brand{color:#fff}header .pill{background:#ffffff22;color:#fff;border-color:#ffffff44}
.jump{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.jump button{border:0;border-radius:99px;background:#ffffffdd;color:#0a4a8c;font-size:12px;font-weight:700;padding:4px 10px;cursor:pointer;box-shadow:0 1px 4px #0004}
.setup h1{color:var(--acc)}.truth{color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
main{flex:1;display:grid;gap:12px;grid-template-columns:1fr;min-height:0}
.left,.right{display:flex;flex-direction:column;gap:12px;min-height:0}
.photo{background:#0b1a30;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);height:42vh;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.mapwrap{position:relative;height:42vh;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;z-index:0}
#map{height:100%;width:100%}
.search{position:absolute;top:10px;left:10px;right:56px;max-width:380px;z-index:1000}
.search .bar{display:flex;gap:6px}
.search input{flex:1;min-width:0;background:#fffffff2;color:#111;border:0;border-radius:10px;padding:10px 12px;box-shadow:0 2px 8px #0006;font-size:16px}
.search .go{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:0 14px;font-weight:800;cursor:pointer}
.sr{background:#fffffff5;border-radius:10px;margin-top:6px;overflow:hidden;box-shadow:0 2px 8px #0006}
.sri{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #0001;color:#222;padding:9px 12px;font-size:14px;cursor:pointer}
.sri:last-child{border:0}
.link{word-break:break-all;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--mut);margin:8px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1;min-width:120px;margin-top:0}
.btn.wa{background:#25d366;color:#06210f}
.hint{color:var(--mut);font-size:14px;margin:8px 0 0}.err{color:#ff7b7b}
.credit{margin-top:10px;font-size:12px;color:var(--mut)}.credit a{color:var(--mut)}
input.txt{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:12px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hist h3{margin:0 0 4px;font-size:20px}.hist .sub{color:var(--acc);font-weight:600;font-size:14px;margin-bottom:8px}
.hist p{margin:0 0 10px;color:#2b4568}.hist .sub{color:var(--acc)}
.who{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;color:var(--mut)}
#yv{font-size:34px;font-weight:800;color:var(--acc);line-height:1}
input[type=range]{width:100%;accent-color:var(--acc);height:32px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:800;font-size:17px;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.sm{border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.res{display:flex;flex-direction:column;gap:8px}
.pr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pr:last-of-type{border:0}.pr small{color:var(--mut);display:block}.pr b.s{font-size:20px;color:var(--acc)}
.truth{font-weight:700;margin-bottom:6px}
.setup{max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px;padding-top:4vh}
.setup h1{margin:0;font-size:42px;letter-spacing:.5px}.setup .tag{color:var(--mut);margin:-6px 0 6px}
.setup h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut)}
.stepper{display:flex;align-items:center;gap:18px}.stepper b{font-size:34px;min-width:50px;text-align:center}
.stepper .sm{width:44px;height:44px;font-size:22px;padding:0}
ul{list-style:none;margin:0 0 10px;padding:0}
li.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}li.pl span.n{flex:1}
.add{display:flex;gap:8px}.add input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px 12px;min-width:0}
.final{max-width:560px;margin:4vh auto 0;width:100%;text-align:center}
.final h1{font-size:34px;margin:0 0 4px}.lb{display:flex;flex-direction:column;text-align:left;margin:14px 0}
.lb .pr{grid-template-columns:28px auto 1fr auto}
.marker{width:26px;height:26px;border-radius:50%;border:3px solid #fff;color:#111;font:700 13px/20px system-ui;text-align:center;box-shadow:0 1px 6px #0008}
.star{font-size:30px;line-height:30px;text-shadow:0 1px 6px #000}
@media(min-width:860px){
 .shell{height:100dvh;padding-bottom:14px}
 main{grid-template-columns:1.15fr 1fr;overflow:hidden}
 .photo{height:auto;flex:1}.left.rev .photo{flex:0 0 46%}
 .mapwrap{height:auto;flex:1}
 .left,.right{overflow:auto}
 .setup{padding-top:6vh}
}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="photos.js"></script>
<script>
const ROUNDS=window.PHOTOS||[];
const MIN=1830,MAX=2026,$=document.getElementById('app');
const COL=['#f2a33a','#4cc9f0','#ef476f','#06d6a0','#b388ff','#ffd166','#ff8fab','#9ef01a'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={n:5,players:['Player 1']};
try{const x=JSON.parse(localStorage.tardisSetup||'null');if(x&&x.players&&x.players.length)S={n:x.n||5,players:x.players}}catch(e){}
S.n=Math.max(1,Math.min(S.n,ROUNDS.length));
const saveS=()=>{try{localStorage.tardisSetup=JSON.stringify(S)}catch(e){}};
const myName=()=>{try{return localStorage.tardisName||S.players[0]||'Player'}catch(e){return S.players[0]||'Player'}};
const saveName=n=>{try{localStorage.tardisName=n}catch(e){}};
const bestKey=()=>'tardisBest'+S.n;
const best=()=>{try{return +localStorage[bestKey()]||0}catch(e){return 0}};
const km=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const logo='<svg viewBox="0 0 64 64"><rect x="29" y="2" width="6" height="6" rx="2" fill="#f2b705"/><rect x="14" y="8" width="36" height="6" fill="#0a4a8c"/><rect x="16" y="14" width="32" height="46" fill="#0a4a8c"/><rect x="12" y="58" width="40" height="4" fill="#06305e"/><rect x="17" y="16" width="30" height="6" fill="#fff"/><g fill="#5b9bdc"><rect x="19" y="26" width="11" height="12"/><rect x="34" y="26" width="11" height="12"/><rect x="19" y="42" width="11" height="12"/><rect x="34" y="42" width="11" height="12"/></g></svg>';
const F=n=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(n)+'?width=1600';
const src=r=>r.u||F(r.f);
let G=null,map=null,NET=null;
const scoreIt=(r,lat,lng,gy)=>{const d=Math.round(km(lat,lng,r.lat,r.lng)),dy=Math.abs(gy-r.y),ls=Math.round(5000*Math.exp(-d/1500)),ys=Math.max(0,5000-250*dy);return{lat,lng,gy,d,dy,ls,ys,s:ls+ys}};
const SKIP={skipped:true,lat:0,lng:0,gy:0,d:0,dy:0,ls:0,ys:0,s:0};
function killMap(){if(map){map.remove();map=null}}
function leaveNet(){if(NET){try{NET.peer&&NET.peer.destroy()}catch(e){}NET=null}}
function shuffled(n){return [...ROUNDS.keys()].sort(()=>Math.random()-.5).slice(0,n)}
function newLocalGame(){G={rs:shuffled(S.n).map(i=>ROUNDS[i]),i:0,pi:0,players:[...S.players],me:null,tot:S.players.map(()=>0)};G.res=G.rs.map(()=>[]);turn()}

/* ---------- start screen ---------- */
function setup(){
 killMap();leaveNet();G=null;history.replaceState(null,'',location.pathname);
 $.innerHTML=`<div class=shell><div class=setup>
 <div class=brand style="font-size:22px">${logo}Tardis</div>
 <h1>Where and when?</h1><div class=tag>Look at the photo, pin the place, pick the year.</div>
 <div class=card><h2>Rounds</h2><div class=stepper><button class=sm id=rm>−</button><b id=rn>${S.n}</b><button class=sm id=rp>+</button><span style="color:var(--mut)">of ${ROUNDS.length} photos</span></div></div>
 <div class=card><h2>Players on this device</h2><ul id=pl></ul><div class=add><input id=nm placeholder="Add a player" maxlength=16><button class=sm id=ad>Add</button></div></div>
 <button class=btn id=go>Start game</button>
 <button class="btn ghost" id=online>Invite friends and play online (share a link)</button>
 <div class=tag style="text-align:center;margin:0">Best for ${S.n} rounds: <b style="color:var(--fg)">${best()}</b></div></div></div>`;
 const list=()=>{pl.innerHTML=S.players.map((n,i)=>`<li class=pl><span class=dot style="background:${COL[i%8]}"></span><span class=n>${esc(n)}</span>${S.players.length>1?`<button class=sm data-i=${i}>Remove</button>`:''}</li>`).join('');
  pl.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.players.splice(+b.dataset.i,1);saveS();list()});
  ad.disabled=nm.disabled=S.players.length>=8};
 rm.onclick=()=>{S.n=Math.max(1,S.n-1);rn.textContent=S.n;saveS()};
 rp.onclick=()=>{S.n=Math.min(ROUNDS.length,S.n+1);rn.textContent=S.n;saveS()};
 const add=()=>{const v=nm.value.trim();if(v&&S.players.length<8){S.players.push(v);nm.value='';saveS();list()}};
 ad.onclick=add;nm.onkeydown=e=>{if(e.key==='Enter')add()};
 go.onclick=newLocalGame;
 online.onclick=hostScreen;list()}

/* ---------- game frame, search, local turn ---------- */
function frame(rev){
 killMap();const r=G.rs[G.i],P=G.players;
 $.innerHTML=`<div class=shell><header><div class=brand>${logo}Tardis</div><span class=pill>Round ${G.i+1} / ${G.rs.length}</span>
 <div class=chips>${P.map((n,i)=>`<span class="chip ${G.me==null&&!rev&&i===G.pi?'on':''}"><span class=dot style="background:${COL[i%8]}"></span>${esc(n)}${G.me===i?' (you)':''} <b>${G.tot[i]}</b></span>`).join('')}</div></header>
 <main><section class="left ${rev?'rev':''}"><div class=photo><img id=img alt="Mystery photo" src="${esc(src(r))}"></div><div id=hist class="card hist" hidden></div></section>
 <section class=right><div class=mapwrap><div id=map></div>${rev?'':`<form class=search id=sf autocomplete=off><div class=bar><input id=sq placeholder="Search a place to jump the map, e.g. New York" aria-label="Search a place"><button class=go>Go</button></div><div class=jump id=jp></div><div class=sr id=sr></div></form>`}</div><div id=panel class=card></div></section></main></div>`;
 img.onerror=()=>{img.outerHTML='<div style="color:var(--mut);padding:20px">Could not load the photo. Check your connection.</div>'};
 map=L.map('map',{worldCopyJump:true,zoomControl:true,minZoom:1}).setView([30,10],2);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
 if(!rev)wireSearch();
 setTimeout(()=>map&&map.invalidateSize(),60)}

const REG={World:null,Europe:[[35,-12],[62,40]],Asia:[[5,60],[55,145]],Africa:[[-35,-18],[37,52]],'N. America':[[15,-135],[60,-55]],'S. America':[[-55,-82],[12,-35]],Oceania:[[-47,110],[-5,180]]};
function wireSearch(){
 jp.innerHTML=Object.keys(REG).map(k=>`<button type=button data-k="${k}">${k}</button>`).join('');
 jp.querySelectorAll('button').forEach(b=>b.onclick=()=>{const r=REG[b.dataset.k];r?map.fitBounds(r):map.setView([30,10],2)});
 L.DomEvent.disableClickPropagation(sf);L.DomEvent.disableScrollPropagation(sf);
 sf.onsubmit=async e=>{e.preventDefault();const v=sq.value.trim();if(!v)return;
  sr.innerHTML='<div class=sri>Searching…</div>';
  try{const r=await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=en&q='+encodeURIComponent(v))).json();
   sr.innerHTML=r.length?r.map((x,i)=>`<button type=button class=sri data-i=${i}>${esc(x.display_name)}</button>`).join(''):'<div class=sri>No results</div>';
   sr.querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=r[+b.dataset.i],bb=x.boundingbox.map(Number);
    map.fitBounds([[bb[0],bb[2]],[bb[1],bb[3]]],{maxZoom:10});sr.innerHTML='';sq.value=x.display_name.split(',')[0]})
  }catch(err){sr.innerHTML='<div class=sri>Search unavailable right now</div>'}}}

function setupGuessUI(onLock){
 let pin=null,guess=null;
 map.on('click',e=>{guess=e.latlng;pin?pin.setLatLng(guess):pin=L.marker(guess).addTo(map);ok.disabled=false;ok.textContent='Lock in guess'});
 year.oninput=()=>yv.textContent=year.value;
 ok.onclick=()=>onLock(guess,+year.value)}
const yearRow=`<div class=row><span>Year</span><span id=yv>1950</span></div><input id=year type=range min=${MIN} max=${MAX} value=1950><button class=btn id=ok disabled>Tap the map to place your pin</button>`;

function turn(){ // pass-and-play on one device
 frame(false);const r=G.rs[G.i],p=G.players[G.pi],c=COL[G.pi%8];
 panel.innerHTML=`${G.players.length>1?`<div class=who><span class=dot style="background:${c}"></span>${esc(p)}'s turn</div>`:''}${yearRow}`;
 setupGuessUI((g,gy)=>{const x=scoreIt(r,g.lat,g.lng,gy);G.res[G.i][G.pi]=x;G.tot[G.pi]+=x.s;
  if(G.pi+1<G.players.length){G.pi++;turn()}else reveal()})}

function reveal(){
 frame(true);const r=G.rs[G.i],R=G.res[G.i],pts=[[r.lat,r.lng]];
 L.marker([r.lat,r.lng],{icon:L.divIcon({className:'',html:'<div class=star>⭐</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map).bindPopup(esc(r.p));
 R.forEach((x,i)=>{if(!x||x.skipped)return;const c=COL[i%8];pts.push([x.lat,x.lng]);
  L.marker([x.lat,x.lng],{icon:L.divIcon({className:'',html:`<div class=marker style="background:${c}">${esc(G.players[i][0].toUpperCase())}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);
  L.polyline([[x.lat,x.lng],[r.lat,r.lng]],{color:c,dashArray:'6',weight:3}).addTo(map)});
 map.fitBounds(pts,{padding:[50,50],maxZoom:7});
 const page=r.page||('https://commons.wikimedia.org/wiki/File:'+encodeURIComponent((r.f||r.t||'').replace(/^File:/,'')));
 hist.hidden=false;hist.innerHTML=`<h3>${esc(r.p)}</h3><div class=sub>${r.y}</div>${r.h.split(String.fromCharCode(10,10)).map(t=>`<p>${esc(t)}</p>`).join('')}<div class=credit>${r.a?esc(r.a)+' · ':''}${r.l?esc(r.l)+' · ':''}<a href="${esc(page)}" target=_blank rel=noopener>Photo on Wikimedia Commons</a></div>`;
 const last=G.i+1>=G.rs.length,canNext=!NET||NET.role==='host';
 panel.innerHTML=`<div class=truth>It was ${esc(r.p)}, ${r.y}</div><div class=res>${R.map((x,i)=>x&&!x.skipped?`<div class=pr><span class=dot style="background:${COL[i%8]}"></span><div>${esc(G.players[i])}<small>${x.d.toLocaleString()} km off · ${x.gy} (${x.dy} yr off)</small></div><b class=s>${x.s}</b></div>`:`<div class=pr><span class=dot style="background:${COL[i%8]}"></span><div>${esc(G.players[i])}<small>No guess</small></div><b class=s>0</b></div>`).join('')}</div>
 ${canNext?`<button class=btn id=nx>${last?'See results':'Next round'}</button>`:'<p class=hint>Waiting for the host to continue…</p>'}`;
 if(canNext)nx.onclick=()=>{
  if(NET){if(last){bc({t:'end',tot:G.tot});end()}else{G.i++;bc({t:'round',i:G.i});turnOnline()}}
  else if(last)end();else{G.i++;G.pi=0;turn()}}}

function end(){
 killMap();const P=G.players;
 const order=P.map((n,i)=>({n,i,t:G.tot[i]})).sort((a,b)=>b.t-a.t),max=G.rs.length*10000,multi=P.length>1;
 try{if(!multi&&!NET&&order[0].t>best())localStorage[bestKey()]=order[0].t}catch(e){}
 $.innerHTML=`<div class=shell><div class=final><div class=brand style="justify-content:center">${logo}Tardis</div>
 <h1>${multi?esc(order[0].n)+' wins!':'Final score'}</h1><div style="color:var(--mut)">out of ${max.toLocaleString()}</div>
 <div class="card lb">${order.map((o,k)=>`<div class=pr><b>${k+1}</b><span class=dot style="background:${COL[o.i%8]}"></span><span>${esc(o.n)}</span><b class=s>${o.t.toLocaleString()}</b></div>`).join('')}</div>
 ${NET?'':'<button class=btn id=again>Play again</button>'}<button class="btn ghost" id=cfg>${NET?'Back to start':'Change rounds or players'}</button></div></div>`;
 if(!NET)again.onclick=newLocalGame;
 cfg.onclick=setup}

/* ---------- online (peer-to-peer via PeerJS) ---------- */
const ICE={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:openrelay.metered.ca:80'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]}};
const bc=m=>{if(NET&&NET.conns)NET.conns.forEach(c=>{try{c.open&&c.send(m)}catch(e){}})};
const joinLink=id=>location.origin+location.pathname+'#join='+id;
function shell(inner){killMap();$.innerHTML=`<div class=shell><div class=setup><div class=brand style="font-size:22px">${logo}Tardis</div>${inner}</div></div>`}
function noPeer(){if(typeof Peer==='undefined'){shell('<h1>Online play unavailable</h1><p class=hint>The connection library could not load. Check your internet and try again.</p><button class=btn id=bk>Back</button>');bk.onclick=setup;return true}return false}

function hostScreen(){
 if(noPeer())return;
 shell(`<h1>Play online</h1><div class=tag>You host the game. Share the link and friends join from their own phones.</div>
 <div class=card><h2>Your name</h2><input class=txt id=hn maxlength=16 value="${esc(myName())}"></div>
 <button class=btn id=mk>Create game</button><button class="btn ghost" id=bk>Back</button>
 <p class=hint>Keep this screen open while you play: your device runs the game.</p>`);
 bk.onclick=setup;
 mk.onclick=()=>{const n=hn.value.trim()||'Host';saveName(n);hostStart(n)}}

function hostStart(name){
 const b=document.getElementById('mk');if(b){b.disabled=true;b.textContent='Creating…'}
 const id='tardis-'+Math.random().toString(36).slice(2,8),peer=new Peer(id,ICE);
 NET={role:'host',peer,conns:[],names:[name],gone:{},id};
 peer.on('open',()=>hostLobby());
 peer.on('connection',c=>{c.on('data',m=>hostMsg(c,m));c.on('close',()=>hostLeft(c));c.on('error',()=>hostLeft(c))});
 peer.on('error',e=>{if(e.type==='unavailable-id'){leaveNet();hostStart(name)}else if(!NET||!NET.started){shell(`<h1>Could not start</h1><p class="hint err">${esc(e.type||'Connection problem')}. Check your connection and try again.</p><button class=btn id=bk>Back</button>`);bk.onclick=setup}})}

function hostLobby(){
 const link=joinLink(NET.id),text='Join my Tardis game: '+link;
 shell(`<h1>Lobby</h1><div class=tag>Send this link to your friends.</div>
 <div class=card><div class=link id=lk>${esc(link)}</div>
 <div class=btnrow><a class="btn wa" style="text-decoration:none;text-align:center" target=_blank rel=noopener href="https://wa.me/?text=${encodeURIComponent(text)}">Share on WhatsApp</a><button class="btn ghost" id=cp>Copy link</button>${navigator.share?'<button class="btn ghost" id=sh>Share…</button>':''}</div></div>
 <div class=card><h2>Players (${NET.names.length})</h2><ul id=pl>${NET.names.map((n,i)=>`<li class=pl><span class=dot style="background:${COL[i%8]}"></span><span class=n>${esc(n)}${i===0?' (host)':''}</span></li>`).join('')}</ul><p class=hint>${NET.names.length<2?'Waiting for friends to join…':''}</p></div>
 <div class=card><h2>Rounds</h2><div class=stepper><button class=sm id=rm>−</button><b id=rn>${S.n}</b><button class=sm id=rp>+</button><span style="color:var(--mut)">of ${ROUNDS.length}</span></div></div>
 <button class=btn id=st>Start game</button><button class="btn ghost" id=bk>Cancel</button>`);
 rm.onclick=()=>{S.n=Math.max(1,S.n-1);rn.textContent=S.n;saveS()};
 rp.onclick=()=>{S.n=Math.min(ROUNDS.length,S.n+1);rn.textContent=S.n;saveS()};
 cp.onclick=async()=>{try{await navigator.clipboard.writeText(link);cp.textContent='Copied!'}catch(e){const r=document.createRange();r.selectNode(lk);getSelection().removeAllRanges();getSelection().addRange(r);cp.textContent='Select & copy'}};
 if(window.sh)sh.onclick=()=>navigator.share({title:'Tardis',text:'Join my Tardis game',url:link}).catch(()=>{});
 bk.onclick=setup;st.onclick=hostBegin;
 bc({t:'lobby',names:NET.names})}

function hostMsg(c,m){
 if(!m||!NET)return;
 if(m.t==='hello'){
  if(NET.started){c.send({t:'busy'});return}
  if(m.ver!==ROUNDS.length){c.send({t:'err',msg:'Different app versions. Refresh the page and join again.'});return}
  if(c.pidx!=null)return;
  c.pidx=NET.names.length;NET.names.push(String(m.name||'Player').slice(0,16));NET.conns.push(c);
  c.send({t:'welcome',me:c.pidx});hostLobby()}
 else if(m.t==='guess'&&G&&c.pidx!=null)hostGuess(c.pidx,m)}

function hostLeft(c){
 if(!NET||c.pidx==null)return;
 if(!NET.started){const k=NET.conns.indexOf(c);if(k<0)return;NET.conns.splice(k,1);NET.names.splice(c.pidx,1);NET.conns.forEach((x,j)=>x.pidx=j+1);hostLobby()}
 else{NET.gone[c.pidx]=true;checkAll()}}

function hostBegin(){
 NET.started=true;const order=shuffled(S.n),P=[...NET.names];
 G={rs:order.map(i=>ROUNDS[i]),i:0,pi:0,players:P,me:0,tot:P.map(()=>0)};G.res=G.rs.map(()=>[]);
 NET.conns.forEach(c=>c.send({t:'start',order,players:P,me:c.pidx}));
 turnOnline()}

function turnOnline(){
 frame(false);
 panel.innerHTML=yearRow;
 setupGuessUI((g,gy)=>{
  ok.disabled=true;year.disabled=true;map.off('click');
  panel.insertAdjacentHTML('beforeend','<p class=hint id=wt>Guess locked in. Waiting for the others…</p>');
  if(NET.role==='host')hostGuess(0,{lat:g.lat,lng:g.lng,gy});else NET.conn.send({t:'guess',lat:g.lat,lng:g.lng,gy})})}

function hostGuess(pi,m){
 const r=G.rs[G.i];if(G.res[G.i][pi]||G.revealed===G.i)return;
 const x=scoreIt(r,+m.lat,+m.lng,+m.gy);G.res[G.i][pi]=x;G.tot[pi]+=x.s;checkAll()}

function checkAll(){
 if(!G||!NET||G.revealed===G.i)return;
 const need=G.players.map((_,i)=>i).filter(i=>!NET.gone[i]),R=G.res[G.i],k=need.filter(i=>R[i]).length;
 if(k<need.length){const w=document.getElementById('wt');if(w)w.textContent=`Guess locked in. Waiting for the others (${k}/${need.length})…`;bc({t:'wait',k,n:need.length});return}
 for(let i=0;i<G.players.length;i++)if(!R[i])R[i]={...SKIP};
 G.revealed=G.i;bc({t:'reveal',res:R,tot:G.tot});reveal()}

/* guest side */
function joinScreen(id){
 if(noPeer())return;
 shell(`<h1>Join game</h1><div class=tag>You've been invited to a Tardis game.</div>
 <div class=card><h2>Your name</h2><input class=txt id=jn maxlength=16 value="${esc(myName()==='Player 1'?'':myName())}" placeholder="Enter your name"></div>
 <button class=btn id=jb>Join</button><p class=hint id=jm></p>`);
 const go=()=>{const n=jn.value.trim();if(!n){jm.textContent='Enter a name first.';return}saveName(n);jb.disabled=true;jm.className='hint';jm.textContent='Connecting to the host…';guestJoin(id,n)};
 jb.onclick=go;jn.onkeydown=e=>{if(e.key==='Enter')go()}}

function guestFail(msg){leaveNet();shell(`<h1>Couldn't join</h1><p class="hint err">${esc(msg)}</p><button class=btn id=bk>Back to start</button>`);bk.onclick=setup}
function guestJoin(id,name){
 const peer=new Peer(undefined,ICE);NET={role:'guest',peer,names:[]};
 const timer=setTimeout(()=>{if(NET&&!NET.welcomed)guestFail('Could not reach the host. Make sure the host still has the game open, then try again. Some mobile networks block direct connections.')},30000);
 peer.on('open',()=>{const c=peer.connect(id,{reliable:true});NET.conn=c;
  c.on('open',()=>c.send({t:'hello',name,ver:ROUNDS.length}));
  c.on('data',guestMsg);
  c.on('close',()=>{if(NET&&NET.role==='guest'&&!NET.done)guestFail('The host left the game.')})});
 peer.on('error',e=>{clearTimeout(timer);guestFail(e.type==='peer-unavailable'?'That game was not found. It may have ended, so ask for a new link.':'Connection problem ('+(e.type||'unknown')+').')})}

function guestMsg(m){
 if(!m||!NET)return;
 if(m.t==='err'||m.t==='busy')return guestFail(m.t==='busy'?'That game has already started.':m.msg);
 if(m.t==='welcome'){NET.welcomed=true;NET.me=m.me}
 else if(m.t==='lobby'){NET.names=m.names;if(!G)guestLobby()}
 else if(m.t==='start'){G={rs:m.order.map(i=>ROUNDS[i]),i:0,pi:0,players:m.players,me:m.me,tot:m.players.map(()=>0)};G.res=G.rs.map(()=>[]);turnOnline()}
 else if(m.t==='wait'){const w=document.getElementById('wt');if(w)w.textContent=`Guess locked in. Waiting for the others (${m.k}/${m.n})…`}
 else if(m.t==='reveal'&&G){G.res[G.i]=m.res;G.tot=m.tot;reveal()}
 else if(m.t==='round'&&G){G.i=m.i;turnOnline()}
 else if(m.t==='end'&&G){G.tot=m.tot;NET.done=true;end()}}

function guestLobby(){
 shell(`<h1>You're in!</h1><div class=tag>Waiting for the host to start the game.</div>
 <div class=card><h2>Players (${NET.names.length})</h2><ul>${NET.names.map((n,i)=>`<li class=pl><span class=dot style="background:${COL[i%8]}"></span><span class=n>${esc(n)}${i===NET.me?' (you)':''}${i===0?' (host)':''}</span></li>`).join('')}</ul></div>
 <button class="btn ghost" id=bk>Leave</button>`);
 bk.onclick=setup}

/* ---------- boot ---------- */
const jm=location.hash.match(/join=([\w-]+)/);
if(jm)joinScreen(jm[1]);else setup();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
