<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Tardis</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#14110f;--card:#221d19;--fg:#f4ece3;--mut:#a89d92;--acc:#f2a33a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;padding:10px 16px;color:var(--mut);font-size:14px}
#photo{flex:1 1 40%;min-height:0;background:#000 center/contain no-repeat}
#map{flex:1 1 30%;min-height:0}
#panel{padding:12px 16px;background:var(--card)}
#year{width:100%;accent-color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#yv{font-size:28px;font-weight:700;color:var(--acc)}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#14110f;font-size:17px;font-weight:700}
button:disabled{opacity:.4}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;text-align:center}
.center button{max-width:320px}h1{font-size:40px;margin:0}.big{font-size:44px;color:var(--acc);font-weight:700}
.res{color:var(--mut);margin:6px 0 10px;line-height:1.5}.res b{color:var(--fg)}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const F=n=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(n)+'?width=1400';
// Add more rounds here: photo (Wikimedia Commons file name), year, lat, lng, place
const ROUNDS=[
{f:'Lunch atop a Skyscraper - Charles Clyde Ebbets.jpg',y:1932,lat:40.7587,lng:-73.9787,p:'Rockefeller Center, New York'},
{f:'Lange-MigrantMother02.jpg',y:1936,lat:35.0422,lng:-120.4749,p:'Nipomo, California'},
{f:'Raising the Flag on Iwo Jima, larger - edit1.jpg',y:1945,lat:24.7536,lng:141.2889,p:'Iwo Jima, Japan'},
{f:'Hindenburg disaster.jpg',y:1937,lat:40.03,lng:-74.353,p:'Lakehurst, New Jersey'},
{f:'Dust Bowl - Dallas, South Dakota 1936.jpg',y:1936,lat:43.23,lng:-99.51,p:'Dallas, South Dakota'}];
const MIN=1826,MAX=2026,$=document.getElementById('app');
let rs,i,total,map,pin,guess;
const km=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const best=()=>{try{return +localStorage.tgBest||0}catch(e){return 0}};
function home(){$.innerHTML=`<div class=center><h1>Tardis</h1><div class=res>Guess where and when each photo was taken.<br>Best score: <b>${best()}</b></div><button id=go>Play</button></div>`;go.onclick=start}
function start(){rs=[...ROUNDS].sort(()=>Math.random()-.5).slice(0,5);i=0;total=0;round()}
function round(){const r=rs[i];guess=null;
$.innerHTML=`<header><span>Round ${i+1}/${rs.length}</span><span>Score ${total}</span></header><div id=photo></div><div id=map></div>
<div id=panel><div class=row><span>Year</span><span id=yv>1950</span></div><input id=year type=range min=${MIN} max=${MAX} value=1950><button id=ok disabled style="margin-top:10px">Tap map to place pin</button></div>`;
photo.style.backgroundImage=`url("${F(r.f)}")`;
map=L.map('map',{worldCopyJump:true,zoomControl:false}).setView([25,10],1);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
map.on('click',e=>{guess=e.latlng;pin?pin.setLatLng(guess):pin=L.marker(guess).addTo(map);ok.disabled=false;ok.textContent='Guess'});
pin=null;year.oninput=()=>yv.textContent=year.value;ok.onclick=()=>reveal(r,+year.value)}
function reveal(r,gy){const d=Math.round(km(guess.lat,guess.lng,r.lat,r.lng)),dy=Math.abs(gy-r.y);
const ls=Math.round(5000*Math.exp(-d/1500)),ys=Math.max(0,5000-250*dy),s=ls+ys;total+=s;
ok.disabled=true;L.marker([r.lat,r.lng]).addTo(map).bindPopup(r.p).openPopup();
L.polyline([guess,[r.lat,r.lng]],{color:'#f2a33a',dashArray:'6'}).addTo(map);map.fitBounds([guess,[r.lat,r.lng]],{padding:[40,40],maxZoom:6});
panel.innerHTML=`<div class=res><b>${r.p}, ${r.y}</b><br>You were <b>${d.toLocaleString()} km</b> off (${ls} pts) and <b>${dy} year${dy==1?'':'s'}</b> off (${ys} pts)<br>Round: <b>${s}</b></div><button id=nx>${i+1<rs.length?'Next':'Finish'}</button>`;
nx.onclick=()=>{i++;i<rs.length?round():end()}}
function end(){try{if(total>best())localStorage.tgBest=total}catch(e){}
$.innerHTML=`<div class=center><div>Final score</div><div class=big>${total}</div><div class=res>out of ${rs.length*10000}</div><button id=again>Play again</button></div>`;again.onclick=start}
home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
